[package]
name = "broodcasc-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Command-line tool for reading files out of StarCraft: Remastered CASC storage"
publish = false

[[bin]]
name = "broodcasc"
path = "src/main.rs"

[dependencies]
broodcasc = { path = "..", features = ["cdn-http"] }
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
globset = "0.4.19"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
