[workspace]
members = ["cli"]
# Root-level `cargo run` resolves to the workspace's only bin (the CLI),
# while `cargo test`/`build` still cover both crates.
default-members = [".", "cli"]

[package]
name = "broodcasc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Pure-Rust reader for CASC archives as used by StarCraft: Remastered"
repository = "https://github.com/ShieldBattery/broodcasc"
keywords = ["casc", "starcraft", "blizzard", "archive"]
categories = ["parser-implementations", "game-development"]

[features]
default = ["fs", "cdn", "fast-inflate"]
# Local filesystem storage backend (not available on wasm32-unknown-unknown)
fs = []
# CDN ("online") storage core: discovery/index parsing and CdnStorage over a
# pluggable transport. No HTTP dependency; works on WASM with a custom
# transport.
cdn = []
# Batteries-included native HTTP transport for `cdn`, using ureq.
cdn-http = ["cdn", "dep:ureq"]
# Inflate BLTE `Z` chunks with zlib-rs (~30% faster decode natively, more
# code) instead of the smaller miniz_oxide. Pure Rust either way; leave it off
# for size-sensitive wasm builds.
fast-inflate = ["dep:zlib-rs"]

[dependencies]
md-5 = "0.11"
miniz_oxide = "0.9"
thiserror = "2.0"
zlib-rs = { version = "0.6.8", default-features = false, features = ["std"], optional = true }
ureq = { version = "3.5", optional = true }

[dev-dependencies]
assert_ok = "1.0"
proptest = "1.12"

[[example]]
name = "cdn_perf"
required-features = ["fs", "cdn-http"]

[[example]]
name = "extract_fuzz_corpus"
required-features = ["fs"]
