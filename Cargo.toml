[package]
name = "broodcasc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
description = "Pure-Rust reader for CASC archives as used by StarCraft: Remastered"
repository = "https://github.com/ShieldBattery/broodcasc"
keywords = ["casc", "starcraft", "blizzard", "archive"]
categories = ["parser-implementations", "game-development"]

[features]
default = ["fs"]
# Local filesystem storage backend (not available on wasm32-unknown-unknown)
fs = []

[dependencies]
md-5 = "0.11"
miniz_oxide = "0.9"
thiserror = "2.0"

[dev-dependencies]
assert_ok = "1.0"
proptest = "1.11"
